{q:"Что будет за нац. оскорбления?",a:["60 минут мут","варн","кик"],c:0},

];

// ====== ЛОГИКА ТЕСТА ======
let test=[],i=0,score=0,player="";
let time=10,interval;
let answered=false,locked=false;

function shuffle(arr){for(let i=arr.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]];}return arr;}
function randomCode(len=6){return Math.random().toString(36).substring(2,len+2).toUpperCase();}

function start(){
  player=document.getElementById("player").value;
  if(!player){alert("Введите ник");return;}
  test=shuffle([...bank]); // теперь все вопросы
  i=0;score=0;
  next();
}

function timer(){
  clearInterval(interval);
  time=10;answered=false;locked=false;
  document.getElementById("timer").innerText="⏱ "+time;
  interval=setInterval(()=>{
    time--;
    document.getElementById("timer").innerText="⏱ "+time;
    if(time<=0 && !answered){
      answered=true;locked=true;
      document.getElementById("r").innerText="TIME OUT";
      document.getElementById("r").className="red";
      disable();
      setTimeout(()=>{i++;next();},600);
    }
  },1000);
}

function next(){
  if(i>=test.length){finish();return;}
  let q=test[i];
  document.getElementById("q").innerText=q.q;
  let answers=shuffle([...q.a]);
  let box=document.getElementById("a");box.innerHTML="";
  answers.forEach(t=>{
    let b=document.createElement("button");
    b.innerText=t;
    b.onclick=()=>check(t,q);
    box.appendChild(b);
  });
  document.getElementById("r").innerText="";
  timer();
}

function disable(){document.querySelectorAll("#a button").forEach(b=>b.disabled=true);}
function check(ans,q){
  if(answered||locked)return;
  answered=true;locked=true;clearInterval(interval);disable();
  if(ans===q.a[q.c]){
    score++;
    document.getElementById("r").innerText="✔ correct";
    document.getElementById("r").className="green";
  } else {
    document.getElementById("r").innerText="✖ wrong";
    document.getElementById("r").className="red";
  }
  setTimeout(()=>{i++;next();},500);
}

function finish(){
  clearInterval(interval);
  document.getElementById("q").innerText="RESULT";
  document.getElementById("a").innerHTML="";
  let msg=score<10?"❌ не прошёл":"✔ прошёл";
  let code=randomCode();
  document.getElementById("r").innerText=score+"/"+test.length+" "+msg+"\nКод: "+code;

  let custom=document.getElementById("customMsg").value.trim();
  let text=`Никнейм: ${player}\nРезультат : ${score}/${test.length}\nКод: ${code}`;
  if(custom) text+=`\nДополнительно: ${custom}`;

  // Отправка в Telegram
  fetch(`https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage`,{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({chat_id: TELEGRAM_CHAT_ID, text})
  });

  // Сохраняем историю локально
  let h=JSON.parse(localStorage.getItem("history")||"[]");
  h.push({player,score,code,date:new Date().toLocaleString()});
  localStorage.setItem("history",JSON.stringify(h));
  loadHistory();
}

function adminLogin(){
  if(document.getElementById("adminPass").value==="admin7197"){
    document.getElementById("adminPanel").classList.remove("hidden");
    loadHistory();
  } else alert("Неверный пароль");
}

function loadHistory(){
  let h=JSON.parse(localStorage.getItem("history")||"[]");
  let html=h.map(e=>`${e.date} — ${e.player} — ${e.score} — ${e.code}`).join("<br>");
  document.getElementById("history").innerHTML=html;
}

function clearAll(){
  localStorage.removeItem("history");
  loadHistory();
}
</script>
